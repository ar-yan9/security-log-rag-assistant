name: local-model-smoke
on:
  push:
    paths:
      - 'generation.py'
      - 'semantic.py'
      - 'test_model_smoke.py'
      - 'requirements-semantic.txt'
      - 'download_model.py'
      - '.github/workflows/model-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-cpu-model:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUN_MODEL_TESTS: '1'
      SMOKE_GGUF_MODEL: models/qwen2.5-0.5b-instruct-q4_k_m.gguf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-semantic.txt
      - run: python -m pip install --only-binary=:all: --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu llama-cpp-python==0.3.36
      - run: python download_model.py
      - run: python -m pytest test_semantic.py test_model_smoke.py -q
